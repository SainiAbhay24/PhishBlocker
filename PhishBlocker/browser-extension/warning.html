<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>PhishBlocker — Threat Detected</title>
<style>
  :root {
    --critical: #c62828;
    --high: #ef6c00;
    --medium: #f9a825;
    --bg: #1b1f23;
    --card: #ffffff;
  }
  body::before {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    font-family: monospace;
    font-size: 13px;
    color: rgba(34, 197, 94, 0.22); /* Glowing Matrix Green */
    pointer-events: none;
    white-space: pre-wrap;
    padding: 30px;
    z-index: -1;
    line-height: 1.8;
    text-shadow: 0 0 8px rgba(34, 197, 94, 0.4);
}
  .card {
    background: var(--card);
    max-width: 560px;
    width: 100%;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,0.4);
  }
  .banner {
    padding: 20px 28px;
    color: white;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .banner.CRITICAL { background: var(--critical); }
  .banner.HIGH { background: var(--high); }
  .banner.MEDIUM { background: var(--medium); }
  .banner .icon { font-size: 28px; }
  .banner h1 { font-size: 18px; margin: 0; }
  .body { padding: 24px 28px; }
  .score-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 16px;
  }
  .score-row .score { font-size: 36px; font-weight: 700; }
  .score-row .label { color: #666; font-size: 13px; }
  .target-url {
    background: #f4f4f5;
    border-radius: 8px;
    padding: 10px 14px;
    word-break: break-all;
    font-family: monospace;
    font-size: 13px;
    margin-bottom: 18px;
  }
  .signals { margin: 0 0 20px 0; padding: 0; list-style: none; }
  .signals li {
    padding: 8px 0;
    border-bottom: 1px solid #eee;
    font-size: 13.5px;
    display: flex;
    justify-content: space-between;
    gap: 12px;
  }
  .signals li .weight { color: #c62828; font-weight: 600; white-space: nowrap; }
  .category {
    display: inline-block;
    background: #fdecea;
    color: #c62828;
    padding: 4px 10px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 600;
    margin-bottom: 16px;
  }
  .actions { display: flex; gap: 10px; margin-top: 8px; }
  button {
    flex: 1;
    padding: 12px;
    border-radius: 8px;
    border: none;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  #backBtn { background: #2e7d32; color: white; }
  #proceedBtn { background: #eee; color: #444; }
  .disclaimer {
    font-size: 11px;
    color: #888;
    margin-top: 16px;
    line-height: 1.4;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="banner" id="banner">
      <span class="icon">⚠️</span>
      <h1 id="bannerText">THREAT DETECTED</h1>
    </div>
    <div class="body">
      <div class="score-row">
        <div>
          <div class="score" id="scoreValue">--/100</div>
          <div class="label">PhishBlocker Risk Score</div>
        </div>
        <div id="verdictBadge" class="category">CATEGORY</div>
      </div>

      <div class="target-url" id="targetUrl">—</div>

      <ul class="signals" id="signalsList"></ul>

      <div class="actions">
        <button id="backBtn">← Go Back to Safety</button>
        <button id="proceedBtn">Proceed anyway (not recommended)</button>
      </div>

      <p class="disclaimer">
        PhishBlocker combines multiple heuristic signals to estimate risk. This is
        not a guarantee of malicious intent — always verify sensitive requests
        (passwords, banking, payments) through an official, independently-typed URL.
      </p>
    </div>
  </div>
  <script src="warning.js"></script>
</body>
</html>
